name: Pickems
options:
  bundleIdPrefix: com.fannypack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Pickems:
    type: application
    platform: iOS
    sources:
      - path: Pickems
    resources:
      - path: Pickems/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fannypack.pickems
        INFOPLIST_FILE: Pickems/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - PickemsTests

  PickemsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PickemsTests
    dependencies:
      - target: Pickems
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fannypack.pickems.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pickems.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pickems"
