<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support — CFB Pickems</title>
  <meta name="description" content="Contact CFB Pickems support. Send a message and we’ll get back to you by email." />
  <link rel="canonical" href="https://pickems-fb.web.app/support" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CFB Pickems" />
  <meta property="og:title" content="Support — CFB Pickems" />
  <meta property="og:description" content="Contact CFB Pickems support. Send a message and we’ll get back to you by email." />
  <meta property="og:url" content="https://pickems-fb.web.app/support" />
  <meta property="og:locale" content="en_US" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Support — CFB Pickems" />
  <meta name="twitter:description" content="Contact CFB Pickems support. Send a message and we’ll get back to you by email." />

  <meta name="apple-itunes-app" content="app-id=6785697079" />
  <meta name="theme-color" content="#14141A" />

  <style>
    :root {
      --bg: #14141A;
      --bg-mid: #1C1C24;
      --ink: #F5F5F7;
      --muted: #9A9AA3;
      --accent: #DC2626;
      --accent-deep: #A61B1B;
      --line: rgba(255, 255, 255, 0.08);
      --field: rgba(255, 255, 255, 0.04);
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --font-body: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 60% at 80% -10%, rgba(220, 38, 38, 0.22), transparent 55%),
        radial-gradient(ellipse 70% 50% at 10% 100%, rgba(220, 38, 38, 0.08), transparent 50%),
        linear-gradient(165deg, #0E0E12 0%, var(--bg) 45%, var(--bg-mid) 100%);
      line-height: 1.5;
    }

    a { color: inherit; }

    .wrap {
      width: min(720px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 2.5rem 0 3.5rem;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 3.25rem;
      animation: rise 0.7s ease-out both;
    }

    .brand {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      text-decoration: none;
    }

    .brand span { color: var(--accent); }

    nav {
      display: flex;
      gap: 1.25rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    nav a {
      text-decoration: none;
      transition: color 0.2s ease;
    }

    nav a:hover { color: var(--ink); }

    nav a[aria-current="page"] { color: var(--ink); }

    main { animation: rise 0.8s ease-out 0.08s both; }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 5.5vw, 2.55rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }

    .lede {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 42ch;
      margin-bottom: 2rem;
    }

    .lede a {
      color: var(--ink);
      text-underline-offset: 0.18em;
    }

    form {
      display: grid;
      gap: 1.1rem;
      padding: 1.35rem 1.35rem 1.5rem;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    label {
      display: grid;
      gap: 0.4rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    .req { color: var(--accent); }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 0.8rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(8, 8, 10, 0.55);
      color: var(--ink);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: transparent;
    }

    textarea {
      min-height: 10rem;
      resize: vertical;
    }

    .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.85rem 1.1rem;
      margin-top: 0.25rem;
    }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 1.35rem;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 4px;
      box-shadow: 0 10px 28px rgba(220, 38, 38, 0.28);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-deep);
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(220, 38, 38, 0.35);
    }

    button:active:not(:disabled) { transform: translateY(0); }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .status {
      min-height: 1.35rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .status.error { color: #FECACA; }

    .thanks {
      display: none;
      padding: 1.5rem 1.4rem;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .thanks h2 {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .thanks p { color: var(--muted); }

    .is-sent form { display: none; }
    .is-sent .thanks { display: block; animation: rise 0.5s ease-out both; }

    footer {
      margin-top: 3.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      animation: rise 1s ease-out 0.22s both;
    }

    footer a {
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    footer a:hover {
      color: var(--ink);
      border-color: var(--muted);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="https://apps.apple.com/app/id6785697079">Pickems<span>.</span></a>
      <nav>
        <a href="https://apps.apple.com/app/id6785697079">App Store</a>
        <a href="/support" aria-current="page">Support</a>
      </nav>
    </header>

    <main>
      <h1>Support</h1>
      <p class="lede">
        Questions about leagues, picks, billing, or the iOS app? Send a note and we will reply at the email you leave.
      </p>

      <form id="support-form" action="/api/support" method="POST">
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />

        <label>
          Name <span style="font-weight:400">(optional)</span>
          <input type="text" name="name" maxlength="120" autocomplete="name" />
        </label>

        <label>
          Email <span class="req" aria-hidden="true">*</span>
          <input type="email" name="email" required maxlength="254" autocomplete="email" inputmode="email" />
        </label>

        <label>
          Subject <span style="font-weight:400">(optional)</span>
          <input type="text" name="subject" id="subject-field" maxlength="160" autocomplete="off" />
        </label>

        <label>
          Message <span class="req" aria-hidden="true">*</span>
          <textarea name="message" required maxlength="5000" rows="8"></textarea>
        </label>

        <div class="actions">
          <button type="submit" id="send">Send message</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <div class="thanks" id="thanks" tabindex="-1">
        <h2>Message sent</h2>
        <p>Thanks — we got it. We will reply to the email you provided.</p>
      </div>
    </main>

    <footer>
      <a href="https://apps.apple.com/app/id6785697079">App Store</a>
      <a href="https://raw.githubusercontent.com/johnmfanning1-svg/Pickems/main/docs/privacy-policy.html">Privacy Policy</a>
      <a href="https://raw.githubusercontent.com/johnmfanning1-svg/Pickems/main/docs/terms.html">Terms of Use</a>
      <span>© Fannypack Inc.</span>
    </footer>
  </div>

  <script>
    (function () {
      var form = document.getElementById("support-form");
      var statusEl = document.getElementById("status");
      var send = document.getElementById("send");
      var thanks = document.getElementById("thanks");

      function showSent() {
        document.body.classList.add("is-sent");
        thanks.focus();
      }

      if (new URLSearchParams(window.location.search).get("sent") === "1") {
        showSent();
        return;
      }

      form.addEventListener("submit", function (event) {
        statusEl.classList.remove("error");
        statusEl.textContent = "";

        var email = String(form.email.value || "").trim();
        var message = String(form.message.value || "").trim();
        var honey = String(form._honey.value || "").trim();
        var name = String(form.name.value || "").trim();
        var subject = String(form.subject.value || "").trim();

        if (honey) {
          event.preventDefault();
          showSent();
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          event.preventDefault();
          statusEl.classList.add("error");
          statusEl.textContent = "Enter a valid email so we can reply.";
          form.email.focus();
          return;
        }

        if (!message) {
          event.preventDefault();
          statusEl.classList.add("error");
          statusEl.textContent = "Write a short message.";
          form.message.focus();
          return;
        }

        event.preventDefault();
        send.disabled = true;
        statusEl.textContent = "Sending…";

        fetch("/api/support", {
          method: "POST",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name: name,
            email: email,
            subject: subject,
            message: message,
            honey: honey
          })
        }).then(function (response) {
          return response.json().then(function (data) {
            return { ok: response.ok && data && data.ok === true, error: data && data.error };
          }).catch(function () {
            return { ok: response.ok, error: null };
          });
        }).then(function (result) {
          if (result.ok) {
            if (window.history && window.history.replaceState) {
              window.history.replaceState(null, "", "/support?sent=1");
            }
            showSent();
            return;
          }
          send.disabled = false;
          statusEl.classList.add("error");
          statusEl.textContent = result.error || "Could not send that just now. Try again in a minute.";
        }).catch(function () {
          send.disabled = false;
          statusEl.classList.add("error");
          statusEl.textContent = "Could not send that just now. Try again in a minute.";
        });
      });
    })();
  </script>
</body>
</html>
