<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open in CFB Pickems</title>
  <meta name="description" content="Open this college football pick'em league in the Pickems iOS app." />
  <meta name="apple-itunes-app" content="app-id=6785697079" />
  <meta name="theme-color" content="#14141A" />
  <style>
    :root {
      --bg: #14141A;
      --ink: #F5F5F7;
      --muted: #9A9AA3;
      --accent: #DC2626;
      --accent-deep: #A61B1B;
      --font-display: "Iowan Old Style", Palatino, Georgia, serif;
      --font-body: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 60% at 80% -10%, rgba(220, 38, 38, 0.22), transparent 55%),
        linear-gradient(165deg, #0E0E12 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    .card { width: min(26rem, 100%); text-align: center; }
  h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }
    p { color: var(--muted); margin-bottom: 1.25rem; }
    .cta {
      display: block;
      width: 100%;
      padding: 0.9rem 1.2rem;
      margin-bottom: 0.75rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
    }
    .cta.secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.16);
      color: var(--ink);
    }
    .cta:hover { background: var(--accent-deep); }
    .cta.secondary:hover { background: rgba(255,255,255,0.06); }
    .help { margin-top: 1.25rem; font-size: 0.85rem; }
    .help a { color: var(--ink); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Open this league</h1>
    <p id="copy">Open CFB Pickems to see this league. If you don’t have the app yet, download it on the App Store.</p>
    <a class="cta" id="open" href="https://apps.apple.com/app/id6785697079">Open in Pickems</a>
    <a class="cta secondary" id="store" href="https://apps.apple.com/app/id6785697079">Download on the App Store</a>
    <p class="help"><a href="/support">Need help?</a></p>
  </div>
  <script>
    (function () {
      var appStore = "https://apps.apple.com/app/id6785697079";
      var path = window.location.pathname.replace(/\/+$/, "");
      var segments = path.split("/").filter(Boolean);
      var groupId = "";
      if (segments[0] === "l" && segments[1]) {
        groupId = decodeURIComponent(segments[1]);
      } else if (segments[0] === "league" && segments[1] && segments.length === 2) {
        groupId = decodeURIComponent(segments[1]);
      }
      var open = document.getElementById("open");
      var store = document.getElementById("store");
      store.href = appStore;
      if (!groupId) {
        document.getElementById("copy").textContent =
          "This league link is missing an id. Ask your league for a fresh share link.";
        open.href = appStore;
        return;
      }
      open.href = window.location.href;
      open.setAttribute("href", "pickems://l/" + encodeURIComponent(groupId));
    })();
  </script>
</body>
</html>
