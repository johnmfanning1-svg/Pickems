name: Upload App Store Screenshots

# Replaces the en-US App Store screenshots for an existing editable version
# with fastlane/screenshots/en-US (6.9in 1320x2868 + 6.5in 1284x2778).
# Screenshots only: no metadata, no binary, never submits for review.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (raw PEM or base64).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Editable App Store version (for example 3.6.12)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upload-screenshots
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_P8}" ]; then echo "Missing ASC_KEY_P8 secret."; exit 1; fi
          KEY="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Upload screenshots with fastlane deliver
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ls -1 fastlane/screenshots/en-US
          fastlane ios screenshots version:"$ASC_VERSION"
