name: Deploy Firebase

on:
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-deploy.yml"
  push:
    branches: [main]
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/tests/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Unit-test Cloud Functions
        run: |
          npm ci --prefix firebase/functions
          npm test --prefix firebase/functions

      - name: Unit-test Firestore rules (G0)
        working-directory: firebase
        run: |
          npm ci --prefix tests
          npx -y firebase-tools@latest emulators:exec --only firestore --project pickems-rules-test "npm --prefix tests test"

  # Hosting-only edits under firebase/scripts (for example stage-hosting.sh)
  # still match the firebase/** path filter. Do not republish Firestore rules
  # or Functions unless this push actually changes them, or a person runs
  # the workflow manually.
  rules-changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether rules and functions should deploy
        id: check
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [ "$event" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$event" != "push" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$before"
          echo "Files changed since $before:"
          git diff --name-only "$before" "${{ github.sha }}"
          if git diff --name-only "$before" "${{ github.sha }}" | grep -Eq '^(firebase/firestore\.rules|firebase/firestore\.indexes\.json|firebase/storage\.rules|firebase/functions/|firebase/firebase\.json|scripts/deploy-firebase\.sh)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, rules-changed]
    if: needs.rules-changed.outputs.deploy == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Deploy rules + functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing FIREBASE_TOKEN repository secret."
            echo "Create one with: npx firebase-tools@latest login:ci"
            echo "Then: gh secret set FIREBASE_TOKEN"
            exit 1
          fi
          chmod +x scripts/deploy-firebase.sh
          ./scripts/deploy-firebase.sh
