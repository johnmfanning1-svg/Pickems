name: Deploy Firebase

on:
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-deploy.yml"
  push:
    branches: [main]
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/tests/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Unit-test Cloud Functions
        run: |
          npm ci --prefix firebase/functions
          npm test --prefix firebase/functions

      - name: Unit-test Firestore rules (G0)
        run: |
          npm ci --prefix firebase/tests
          npx -y firebase-tools@latest emulators:exec --only firestore --project pickems-rules-test "npm --prefix tests test"
        working-directory: firebase

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Deploy rules + functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing FIREBASE_TOKEN repository secret."
            echo "Create one with: npx firebase-tools@latest login:ci"
            echo "Then: gh secret set FIREBASE_TOKEN"
            exit 1
          fi
          chmod +x scripts/deploy-firebase.sh
          ./scripts/deploy-firebase.sh
